<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="google" content="notranslate" />
    <meta name="microsoft" content="notranslate" />
    <meta http-equiv="content-language" content="pt" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      (function() {
        try {
          var search = window.location.search.toLowerCase();
          var manifestHref = '/manifest.json';
          var appTitle = 'SUPER Táxi';

          if (search.indexOf('view=staff') !== -1 || search.indexOf('view=admin') !== -1 || search.indexOf('view=login') !== -1 || search.indexOf('mode=staff') !== -1) {
            manifestHref = '/manifest-staff.json';
            appTitle = 'ST Staff';
          } else if (search.indexOf('view=passenger') !== -1 || search.indexOf('mode=passenger') !== -1) {
            manifestHref = '/manifest-passenger.json';
            appTitle = 'ST Passageiro';
          }

          var manifestLink = document.createElement('link');
          manifestLink.rel = 'manifest';
          manifestLink.id = 'pwa-manifest';
          manifestLink.href = manifestHref;
          document.head.appendChild(manifestLink);

          var appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitleMeta) appleTitleMeta.setAttribute('content', appTitle);
        } catch(e) {}
      })();
    </script>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SUPER Táxi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>SUPER Táxi - JIS TaxiControl LUENA</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
