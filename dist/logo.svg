<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Seamless Dark Rounded Canvas (No white border) -->
  <rect width="512" height="512" rx="108" fill="url(#darkBg)" />
  <rect width="510" height="510" x="1" y="1" rx="107" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" />

  <!-- Taxi Top Sign Light -->
  <path d="M 228 128 L 284 128 L 292 144 L 220 144 Z" fill="url(#goldGrad)" />
  <rect x="236" y="132" width="40" height="8" rx="2" fill="#0F172A" opacity="0.7"/>

  <!-- Sleek Aerodynamic Car Silhouette -->
  <!-- Roof and Windows -->
  <path d="M 180 188 C 210 148, 302 148, 332 188 L 388 200 C 404 204, 416 216, 420 232 L 432 284 C 434 292, 428 300, 420 300 L 92 300 C 84 300, 78 292, 80 284 L 92 232 C 96 216, 108 204, 124 200 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Front and Rear Windshields (Cobalt Glass) -->
  <path d="M 188 190 C 212 158, 248 156, 252 190 Z" fill="url(#glowGrad)" />
  <path d="M 260 190 C 264 156, 300 158, 324 190 Z" fill="url(#glowGrad)" />

  <!-- Car Body Bottom Trim -->
  <path d="M 88 284 L 424 284 L 420 296 L 92 296 Z" fill="#D97706" />

  <!-- Headlights & Taillights -->
  <polygon points="412,250 428,252 426,262 410,260" fill="#60A5FA" />
  <polygon points="100,250 84,252 86,262 102,260" fill="#EF4444" />

  <!-- Wheels Outer -->
  <circle cx="160" cy="300" r="38" fill="#020617" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="352" cy="300" r="38" fill="#020617" stroke="url(#goldGrad)" stroke-width="6" />
  
  <!-- Wheels Rims -->
  <circle cx="160" cy="300" r="16" fill="url(#goldGrad)" />
  <circle cx="352" cy="300" r="16" fill="url(#goldGrad)" />

  <!-- Luxury Typography PSM (Blue) & TAXI (Gold) -->
  <text x="256" y="394" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" letter-spacing="4" fill="url(#blueGrad)" filter="url(#blueGlow)">PSM</text>
  <text x="256" y="454" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="8" fill="url(#goldGrad)">TAXI</text>
</svg>
