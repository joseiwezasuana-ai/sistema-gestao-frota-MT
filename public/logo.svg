<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Seamless Dark Rounded Canvas (No white border) -->
  <rect width="512" height="512" rx="108" fill="url(#darkBg)" />
  <rect width="510" height="510" x="1" y="1" rx="107" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" />

  <!-- Luxury Typography TAXI (Gold) ABOVE THE CAR -->
  <text x="256" y="108" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="900" letter-spacing="10" fill="url(#goldGrad)" filter="url(#glow)">TAXI</text>

  <!-- Taxi Top Sign Light -->
  <path d="M 228 136 L 284 136 L 292 152 L 220 152 Z" fill="url(#goldGrad)" />
  <rect x="236" y="140" width="40" height="8" rx="2" fill="#0F172A" opacity="0.7"/>

  <!-- Sleek Aerodynamic Car Silhouette -->
  <!-- Roof and Windows -->
  <path d="M 180 196 C 210 156, 302 156, 332 196 L 388 208 C 404 212, 416 224, 420 240 L 432 292 C 434 300, 428 308, 420 308 L 92 308 C 84 308, 78 300, 80 292 L 92 240 C 96 224, 108 212, 124 208 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Front and Rear Windshields (Cobalt Glass) -->
  <path d="M 188 198 C 212 166, 248 164, 252 198 Z" fill="url(#glowGrad)" />
  <path d="M 260 198 C 264 164, 300 166, 324 198 Z" fill="url(#glowGrad)" />

  <!-- Car Body Bottom Trim -->
  <path d="M 88 292 L 424 292 L 420 304 L 92 304 Z" fill="#D97706" />

  <!-- Headlights & Taillights -->
  <polygon points="412,258 428,260 426,270 410,268" fill="#60A5FA" />
  <polygon points="100,258 84,260 86,270 102,268" fill="#EF4444" />

  <!-- Wheels Outer -->
  <circle cx="160" cy="308" r="38" fill="#020617" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="352" cy="308" r="38" fill="#020617" stroke="url(#goldGrad)" stroke-width="6" />
  
  <!-- Wheels Rims -->
  <circle cx="160" cy="308" r="16" fill="url(#goldGrad)" />
  <circle cx="352" cy="308" r="16" fill="url(#goldGrad)" />

  <!-- Luxury Typography PSM (Blue) & Subtitle JIS ANGOLA Below Vehicle -->
  <text x="256" y="405" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="url(#blueGrad)" filter="url(#blueGlow)">PSM</text>
  <text x="256" y="452" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="6" fill="#94A3B8">JIS ANGOLA</text>
</svg>
